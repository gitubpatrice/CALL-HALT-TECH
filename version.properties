# Single source of the published version, read by app/build.gradle.kts without any fallback.
#
# versionCode MUST strictly increase: Android refuses to install an APK whose versionCode is lower
# than the installed one, and the user only sees an incomprehensible failure. It is NOT derived from
# `git rev-list --count HEAD` (Agenda Tech, 2026-08): a rebase or a squash makes it go DOWN, and a
# build outside a git checkout silently fell back to 1.
#
# Bump BY HAND at each release (and only there), before building the APK.
# 1 = 0.1.0, the skeleton: nothing published.
versionCode=1
versionName=0.1.0
