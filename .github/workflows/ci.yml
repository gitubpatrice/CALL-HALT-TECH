name: CI

# Modelled on Agenda Tech's (CLAUDE.md § 9.4: the portfolio's model). Work branches trigger too: a branch
# that piles up commits with nothing running on them reports nothing (measured on a sibling app: 25 commits,
# detekt failing since the morning, unreported).
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same ref cancels the previous run: its result is already stale.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate (build · tests · lint · detekt · R8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Translation parity, before any compilation: it costs a second where a failed build costs ten
      # minutes. The negative control runs first: it proves the check can go red, and for the right reason,
      # before its green is believed.
      - name: Translation parity
        run: |
          python3 tools/check-translations-negative-control.py
          python3 tools/check-translations.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # The local gate, in one command, so CI and a developer's machine can never disagree about what
      # "green" means. detekt is blocking, without a baseline.
      - name: Gate
        run: ./gradlew --no-daemon :app:assembleDebug :domain:test :app:testDebugUnitTest :app:lintDebug detekt

      # "BUILD SUCCESSFUL" does not say how many tests ran: a JUnit launcher missing runs none, green.
      - name: Tests actually ran
        run: python3 tools/check-test-results.py

      # R8 is exercised by no other job. Without keystore.properties (never in the repository) the release
      # is signed with the debug key: what is checked here is that R8 keeps what the code needs.
      - name: Release build (exercises R8)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: |
            app/build/reports/
            app/build/test-results/
            domain/build/reports/
            domain/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  zero-network:
    name: Zero-network promise
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Only the manifest merge: it is the artefact that decides which permissions the APK carries.
      - name: Merge the release manifest
        run: ./gradlew --no-daemon :app:processReleaseMainManifest

      # The guard parses the XML (a grep misses a <uses-permission> written across lines) and holds the
      # manifest to an EXACT reviewed list. Its negative control runs first.
      - name: Assert the permissions of the merged release manifest
        run: |
          python3 tools/check-manifest-permissions-negative-control.py
          python3 tools/check-manifest-permissions.py

  instrumented:
    name: Instrumented tests (API 29)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # KVM has to be enabled explicitly on GitHub-hosted runners for the emulator to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 29 to match the physical test phone (Galaxy S9). These tests need a real SQLite: the detector's
      # memory surviving the process is the property the whole method rests on.
      #
      # ⚠️ `connectedDebugAndroidTest` is used HERE ONLY, where the emulator is the sole attached device. It
      # targets EVERY connected device and clears the app's data: never on a developer machine with a real
      # phone attached. Locally, target by serial (ANDROID_SERIAL) or with `adb -s <serial> shell am instrument`.
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
