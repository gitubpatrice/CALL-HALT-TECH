# Dependency watch for Call Halt Tech, modelled on Read Files Tech's. Both ecosystems are watched: GitHub
# Actions are code run with access to the repository too.
version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Grouped: ten separate PRs get closed unread, one grouped PR gets reviewed.
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-and-tools:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.google.dagger*"
          - "io.gitlab.arturbosch.detekt*"
      junit:
        patterns:
          - "org.junit*"
    ignore:
      # Kotlin 2.4.20+: CodeQL 2.27 refuses to compile it ("currently supports versions below 2.4.20", measured
      # on Agenda Tech); the build also pins the compiler with `strictly`. Remove once CodeQL supports it.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.4.20"]
      # JUnit majors stay a deliberate step; minor bumps pass, the platform launcher being declared through the BOM.
      - dependency-name: "org.junit*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
