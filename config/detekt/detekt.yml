# detekt policy for Call Halt Tech — built upon detekt's default configuration, copied from Read Files Tech 3.
#
# This repository starts empty: every rule of the default set and of the ktlint `android` preset stays ACTIVE
# and blocking. Each exception below exists because this project needs it, and says why. There is no
# baseline, and there must never be one: a baseline lets the next instance through.
#
# LIMIT, measured on App Manager Tech and Agenda Tech: under AGP 9, detekt 1.23.8 registers no per-variant
# task, so the rules that need type resolution (RedundantSuspendModifier, SuspendFunSwallowedCancellation…)
# never run. TooGenericExceptionCaught below covers the commonest swallowed-cancellation shape; a
# `catch (e: IllegalStateException)` or a `runCatching { }` around a suspending call still passes, and is
# reviewed by hand.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  # Compose functions are a declarative UI tree, one lambda per user action: their length and parameter
  # count describe the screen, not tangled logic.
  LongMethod:
    active: true
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    # `Inject`: a Hilt constructor's parameter list is its dependency list.
    ignoreAnnotated: ['Composable', 'Inject']
  CyclomaticComplexMethod:
    active: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: true
    ignoreAnnotatedFunctions: ['Composable']

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    # By default, naming the variable `ignored` or `expected` exempts a catch-all. Measured on App Manager
    # Tech: a `catch (ignored: Exception)` around a suspending write passed detekt — the swallowed-
    # cancellation defect. A catch-all must carry a targeted @Suppress with its reason.
    allowedExceptionNameRegex: '^$'

naming:
  active: true
  FunctionNaming:
    # Composables are PascalCase by Compose's own convention.
    ignoreAnnotated: ['Composable']

style:
  active: true
  MagicNumber:
    active: true
    # Theme colours are literals by nature (one hex per tone), and tests state expected values.
    excludes:
      - '**/ui/theme/**'
      - '**/test/**'
      - '**/androidTest/**'
    ignoreEnums: true
  # Same width as the other Kotlin apps of the portfolio, so a reviewer reads them all at one line length.
  MaxLineLength:
    active: true
    maxLineLength: 140

formatting:
  active: true
  android: true
  autoCorrect: false

  # Duplicate of style.MaxLineLength above, which carries the threshold.
  MaximumLineLength:
    active: false

  # The wrapping rules decide "fits on one line" against the ktlint android width (100) unless told
  # otherwise: they would then force a wrap on lines that style.MaxLineLength accepts. One width — 140.
  ArgumentListWrapping:
    maxLineLength: 140
  ParameterListWrapping:
    maxLineLength: 140
  PropertyWrapping:
    maxLineLength: 140
